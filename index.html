<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f6f2" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply only an explicit override before styles paint; CSS supplies System mode.
      try {
        const theme = localStorage.getItem('grace-portfolio-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {
        /* Storage may be unavailable; the OS-aware CSS fallback still works. */
      }
    </script>
    <title>Grace Arnold — Software Engineer</title>
    <meta
      name="description"
      content="Grace Arnold is a software engineer building thoughtful interfaces and reliable services. Explore full-stack production work, creative projects, and teaching experience."
    />
    <meta property="og:title" content="Grace Arnold — Software Engineer" />
    <meta
      property="og:description"
      content="Thoughtful interfaces. Reliable services. Software built for people."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <!-- deployment-metadata -->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
